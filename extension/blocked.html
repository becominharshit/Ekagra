<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Back to study · Ekagra FocusGuard</title>
    <style>
      body { font-family: system-ui, -apple-system, sans-serif; margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f8fafc; color: #0f172a; padding: 24px; }
      main { max-width: 480px; width: 100%; background: #ffffff; border: 1px solid #e2e8f0; border-radius: 16px; padding: 28px; box-shadow: 0 8px 24px rgba(15, 23, 42, 0.06); }
      h1 { margin: 0 0 8px; font-size: 1.5rem; }
      p { color: #475569; line-height: 1.5; margin: 0 0 18px; }
      .site { font-weight: 600; color: #0f172a; }
      .actions { display: flex; flex-wrap: wrap; gap: 10px; }
      button { cursor: pointer; font: inherit; border-radius: 10px; padding: 10px 16px; border: 1px solid #cbd5e1; background: #ffffff; color: #0f172a; font-weight: 500; }
      button.primary { background: #0f172a; color: #ffffff; border-color: #0f172a; }
      .meta { margin-top: 16px; font-size: 0.85rem; color: #64748b; }
    </style>
  </head>
  <body>
    <main>
      <h1>Back to study</h1>
      <p><span id="site-name" class="site">This site</span> is blocked while your Ekagra focus session is active.</p>
      <p id="timer-status" class="meta"></p>
      <div class="actions">
        <button id="back-btn" class="primary" type="button">Back to Ekagra study</button>
        <button id="tollbooth-btn" type="button">Open Academic Tollbooth</button>
      </div>
    </main>
    <script type="module" src="blocked.js"></script>
  </body>
</html>
